name: Actualizar divulgaciones

on:
  schedule:
    - cron: "17 * * * *"     # cada hora, al minuto 17
  workflow_dispatch:          # y cuando lo dispares a mano

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests pdfplumber

      - name: Leer los PTR del Clerk
        run: python scraper.py

      - name: Leer los PTR del Senado
        run: python senado.py
        continue-on-error: true

      - name: Guardar los cambios
        run: |
          git config user.name  "congreso-wire"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs state
          if git diff --staged --quiet; then
            echo "Sin novedades."
          else
            git commit -m "datos $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
